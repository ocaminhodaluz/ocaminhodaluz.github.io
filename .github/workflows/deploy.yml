name: Publicar site

on:
  # Publica quando você aprova conteúdo e ele é enviado pro GitHub (push na branch main)
  push:
    branches: [main]
  # Publica sozinho todo dia às 9h de Brasília (12:00 UTC), liberando o próximo
  # post da fila cuja data (pubDate) já chegou
  schedule:
    - cron: '0 12 * * *'
  # Permite disparar manualmente pela aba "Actions" do GitHub, se precisar
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      # Essa action já instala as dependências, gera o site e envia o
      # resultado como artefato do Pages sozinha (não precisa de um passo
      # separado de upload-pages-artifact depois).
      - name: Instalar dependências, gerar e preparar o site pro Pages
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
